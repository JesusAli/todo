<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Actividades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">Organizador personal</p>
        <h1>Actividades</h1>
        <p class="lede">Organiza tus pendientes personales y de trabajo sin perder de vista sus fechas.</p>
      </header>

      <form class="composer" id="add-form">
        <div class="field field-title">
          <label for="task-input">Actividad</label>
          <input
            id="task-input"
            name="title"
            type="text"
            maxlength="140"
            placeholder="¿Qué necesitas hacer?"
            autocomplete="off"
            required
          />
        </div>
        <div class="field">
          <label for="task-tag">Tipo</label>
          <select id="task-tag" name="tag">
            <option value="personal">Personal</option>
            <option value="trabajo">Trabajo</option>
          </select>
        </div>
        <div class="field">
          <label for="task-due">Fecha límite</label>
          <input id="task-due" name="dueDate" type="date" required />
        </div>
        <button type="submit">Agregar</button>
      </form>

      <section class="toolbar" aria-label="Filtros de actividades">
        <label class="search">
          <span class="sr-only">Buscar actividades</span>
          <input id="search-input" type="search" placeholder="Buscar actividades…" />
        </label>
        <select id="tag-filter" aria-label="Filtrar por tipo">
          <option value="all">Todos los tipos</option>
          <option value="personal">Personal</option>
          <option value="trabajo">Trabajo</option>
        </select>
        <select id="date-filter" aria-label="Filtrar por fecha">
          <option value="all">Todas las fechas</option>
          <option value="overdue">Vencidas</option>
          <option value="today">Para hoy</option>
          <option value="week">Próximos 7 días</option>
        </select>
        <p id="result-summary" aria-live="polite"></p>
      </section>

      <section class="board" aria-label="Tablero de actividades">
        <article class="column" data-status="todo">
          <h2>Por hacer <span class="count" data-count="todo">0</span></h2>
          <ul class="list" id="list-todo"></ul>
        </article>
        <article class="column" data-status="doing">
          <h2>En progreso <span class="count" data-count="doing">0</span></h2>
          <ul class="list" id="list-doing"></ul>
        </article>
        <article class="column" data-status="done">
          <h2>Hecho <span class="count" data-count="done">0</span></h2>
          <ul class="list" id="list-done"></ul>
        </article>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
